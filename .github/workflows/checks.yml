name: Project checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm test
      - run: bash -n scripts/codex-setup.sh
  recognition-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/floorplan/requirements-cloud.txt
      - run: python -m pip install -r services/floorplan/requirements-cloud.txt
      - run: python -m unittest discover -s services/floorplan -p 'test_*.py'
